name: Feature Request
description: Proponha uma nova funcionalidade ou melhoria
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Descreva a feature que você gostaria de ver no Andromeda.

  - type: textarea
    id: context
    attributes:
      label: Contexto / problema
      description: Qual necessidade ou problema essa feature resolve?
      placeholder: "Como practitioner, preciso de X para poder Y sem ter que..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Descreva como você imagina que a feature deveria funcionar.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Módulo afetado
      description: Onde essa feature se encaixa na arquitetura?
      multiple: true
      options:
        - src/core/ (auth, users, patients, templates, sessions, insights, goals, quota)
        - src/modules/diet/ (planos de dieta, diário alimentar, gamificação)
        - src/modules/training-plans/ (planos de treino)
        - src/modules/training-executions/ (treinos realizados)
        - src/modules/scheduled-questionnaires/ (agendamentos recorrentes)
        - src/modules/progress-photos/ (fotos de progresso)
        - src/modules/billing/ (Stripe, assinatura)
        - src/modules/patient-portal/ (portal do paciente)
        - frontend/features/patients/
        - frontend/features/sessions/ (avaliações / anamnese)
        - frontend/features/templates/
        - frontend/features/diet/
        - frontend/features/training-plans/
        - frontend/features/dashboard/
        - frontend/features/auth/ (autenticação, 2FA)
        - frontend/components/ui/ (design system)
        - Infra / CI
        - Novo módulo
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioridade sugerida
      options:
        - Alta — bloqueia uso em produção
        - Média — melhora significativa
        - Baixa — nice-to-have
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Existe algum workaround atual? Outras abordagens avaliadas?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Contexto adicional
      description: Links, referências, mockups, ou qualquer outra informação útil.
    validations:
      required: false
