name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unit_noop
      JWT_SECRET: test-secret-key-min-32-chars-for-ci-pipeline
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm run test:unit

  test:
    name: Integration Tests & Coverage
    runs-on: ubuntu-latest
    needs: [unit-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anamnese_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anamnese_test
      JWT_SECRET: test-secret-key-min-32-chars-for-ci-pipeline
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npm run prisma:seed
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Smoke tests
        run: npm run test:smoke
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          args: -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [sonarqube]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate audit report
        run: |
          echo "## 🔒 Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit-report.json || true
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          npm audit >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Review vulnerabilities and update dependencies when possible." >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      - name: Frontend audit
        run: |
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          cd frontend && npm ci && npm audit >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Compile TypeScript
        run: npm run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [security]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [build, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: andromeda:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/andromeda-image.tar
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/andromeda-image.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          output: trivy-report.txt
        continue-on-error: true
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30
      - name: Summarize Trivy results
        if: always()
        run: |
          echo "## 🐳 Docker Image Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY || echo "No report generated" >> $GITHUB_STEP_SUMMARY
